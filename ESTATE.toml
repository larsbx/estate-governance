version = 3
template = "estate-repository-v3"

# Estate identity, independent authority boundaries and required formalization.

[repo]
id = "estate-governance"
slug = "larsbx/estate-governance"
class = "meta"                # the estate meta-repo sits outside the layering (SPEC_estate §11)
band = "STANDARD"
stage = "candidate"           # written by estate CI only (no estate CI ledger exists yet)
default_branch = "main"
inv = []

[origin]
decided_by = "stated"
decision = "DR-0001"          # larsbx/estate-governance docs/decisions
chats = []
artifacts = []

[exports]
names = ["estate-repository-v3", "estate-repository-v2", "estate.audit", "estate.pin"]

[layout]
status = "canonical"

[principles]
ordering = ["authority", "domain"]
empty_silos = "forbidden"
disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

# The meta-repo imports nothing: it carries no [[dep]].

[[plane]]
id = "policy"
target = "policy"
authority = "governance"
required = true
current = ["policy", "ESTATE.toml"]

[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "ARCHITECTURE.md", "README.md"]

[[plane]]
id = "formal"
target = "formal"
authority = "claim_state"
required = true
current = ["formal"]

[authority]
acceptance_authority = true

[[boundary]]
id = "estate-contract-validation"
implementation = ["kernel/audit_estate_layout.py", "kernel/audit_estate_registry.py", "kernel/ci_impact_policy.py"]
contract = "docs/architecture/estate-repository-template-v3.md"

[formalization]
scope = "docs/formalization.md"
gate = "tools/check_formal.py"
implementation_paths = ["kernel/audit_estate_layout.py", "tools/check_formal.py"]

[formalization.lean]
sources = ["formal/lean/EstateFormal.lean", "formal/lean/Audit.lean"]
toolchain = "leanprover/lean4:v4.34.1"
obligations = [
  "EstateFormal.ready_requires_both",
  "EstateFormal.stale_lean_source_not_ready",
  "EstateFormal.stale_quint_policy_not_ready",
  "EstateFormal.revise_source_invalidates",
  "EstateFormal.revise_policy_invalidates",
  "EstateFormal.transition_preserves_verified",
  "EstateFormal.reachable_verified_requires_both",
  "EstateFormal.transition_preserves_authority",
  "EstateFormal.reachable_preserves_authority",
]

[formalization.quint]
sources = ["formal/quint/EstateFormal.qnt"]
toolchain = "@informalsystems/quint@0.33.1"
obligations = [
  "safety", "missingEvidenceTest", "bothChecksTest", "singleLaneTest",
  "staleSourceTest", "stalePolicyTest", "failedResultTest", "queuedResultTest",
  "authorityPreservedTest",
]

[migration]
mode = "boundary_first"
mass_move = false
next = []

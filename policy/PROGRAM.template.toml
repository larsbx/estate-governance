# Child identity for a durable program in an estate-repository-v3 workspace.
# The child format remains version 1; the root ESTATE.toml owns authority and
# mandatory Lean/Quint formalization. No canonical-language field is required.
version = 1

[program]
id = "PROGRAM_ID"

[status]
lifecycle = "active"          # active | paused | complete | archived
theorem_status_source = "formal/claims.toml"

# Descriptive paths: adapt to the program's real layout. They do not confer
# authority, prove claims, or require creating an empty kernel directory.
[paths]
implementation = "src"
formal = "formal"
docs = "docs"
tests = "tests"

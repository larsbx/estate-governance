version = 2
template = "estate-repository-v2"

# SPEC_estate v0.1 §3 fields, then this template's layout sections.

[repo]
id = "estate-governance"
slug = "larsbx/estate-governance"
class = "meta"                # the estate meta-repo sits outside the layering (SPEC_estate §11)
band = "STANDARD"
stage = "candidate"           # written by estate CI only (no estate CI ledger exists yet)
default_branch = "main"
inv = []

[origin]
decided_by = "proposed"       # agent-authored; the owner adopts it by decision record
chats = []
artifacts = []

[exports]
names = ["estate-repository-v2", "estate.audit", "estate.pin"]

[layout]
status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

# The meta-repo imports nothing: it carries no [[dep]].

[[plane]]
id = "policy"
target = "policy"
authority = "governance"
required = true
current = ["policy", "ESTATE.toml"]

[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "ARCHITECTURE.md", "README.md"]

[[language]]
name = "Python"
authority = "canonical"
roles = ["kernel", "tooling"]
acceptance_authority = true

[migration]
mode = "boundary_first"
mass_move = false
next = []

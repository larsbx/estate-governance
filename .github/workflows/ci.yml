name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Audit estate repository architecture
        run: python kernel/audit_estate_layout.py
      - name: Audit estate-wide registry invariants
        run: python kernel/audit_estate_registry.py
      - name: Generated adopter register is current
        run: python tools/render_adopters.py --check
      - name: Test repository-local and estate-wide governance
        run: python -m pytest

  registry-source-acquisition:
    name: Authenticated registry source acquisition
    # Forks cannot receive credentials. The final gate below treats a skip as failure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # REQUIRED: environment-only App key, required reviewer, no admin bypass.
    # Review the exact workflow/run before approving; see credential setup docs.
    environment: registry-source-read
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - name: Check out immutable acquisition tools, never candidate code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 2d91af29ad4e8f8fbcfcca7b30cb3e8a330e9254
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Prepare exact candidate as data and trusted repository scope
        id: prepare
        run: >-
          python tools/registry_source_access.py prepare
          --candidate "$CANDIDATE_SHA" --pull-request "$PULL_REQUEST_NUMBER"
          --receipt "$RUNNER_TEMP/registry-source-observation.json"
      - name: Require protected-environment App configuration
        env:
          REGISTRY_APP_ID: ${{ vars.REGISTRY_SOURCE_APP_ID }}
          REGISTRY_APP_PRIVATE_KEY: ${{ secrets.REGISTRY_SOURCE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$REGISTRY_APP_ID" ] || [ -z "$REGISTRY_APP_PRIVATE_KEY" ]; then
            echo "::error::CONFIGURATION: registry-source-read requires REGISTRY_SOURCE_APP_ID and environment-only REGISTRY_SOURCE_APP_PRIVATE_KEY; configure required reviewers before adding the key."
            exit 1
          fi
      - name: Mint narrowly scoped read-only installation token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.REGISTRY_SOURCE_APP_ID }}
          private-key: ${{ secrets.REGISTRY_SOURCE_APP_PRIVATE_KEY }}
          owner: larsbx
          repositories: ${{ steps.prepare.outputs.repositories }}
          permission-contents: read
          skip-token-revoke: false
      - name: Authenticate, capture immutable evidence and verify freshness
        env:
          ESTATE_SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: >-
          python tools/registry_source_access.py verify
          --candidate "$CANDIDATE_SHA"
          --sources "$RUNNER_TEMP/estate-registry-sources"
          --receipt "$RUNNER_TEMP/registry-source-observation.json"
      - name: Preserve public receipt only, including configuration and acquisition failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-source-observation
          path: ${{ runner.temp }}/registry-source-observation.json
          if-no-files-found: error
          retention-days: 30

  registry-freshness:
    name: Registry snapshot freshness
    needs: registry-source-acquisition
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful authenticated acquisition and verification
        env:
          SOURCE_RESULT: ${{ needs.registry-source-acquisition.result }}
        run: |
          if [ "$SOURCE_RESULT" != "success" ]; then
            echo "::error::Authenticated source acquisition did not succeed ($SOURCE_RESULT); missing evidence cannot pass this gate."
            exit 1
          fi

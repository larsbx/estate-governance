name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Audit estate repository architecture
        run: python kernel/audit_estate_layout.py
      - name: Audit estate-wide registry invariants
        run: python kernel/audit_estate_registry.py
      - name: Generated adopter register is current
        run: python tools/render_adopters.py --check
      - name: Validate versioned impact policy (no selective test execution yet)
        run: python kernel/ci_impact_policy.py --root . --check
      - name: Test repository-local and estate-wide governance
        run: python -m pytest

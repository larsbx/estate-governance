name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Audit estate repository architecture
        run: python kernel/audit_estate_layout.py
      - name: Audit estate-wide registry invariants
        run: python kernel/audit_estate_registry.py
      - name: Generated adopter register is current
        run: python tools/render_adopters.py --check
      - name: Test repository-local and estate-wide governance
        run: python -m pytest

  registry-freshness:
    name: Registry snapshot freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Capture source heads and verify registry provenance and freshness
        run: >-
          python tools/check_registry_freshness.py
          --fetch --sources "$RUNNER_TEMP/estate-registry-sources"
      - name: Preserve source observation, including acquisition failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-source-observation
          path: ${{ runner.temp }}/estate-registry-sources/observation.json
          if-no-files-found: error
          retention-days: 30
